name: Auto Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-release-embedded-c-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release unpublished version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Plan automatic release
        id: plan
        run: |
          python3 <<'PY'
          import datetime
          import os
          import re
          import subprocess

          RELEVANT_PATHS = [
              "src",
              "include",
              "tests",
              "Makefile",
              "VERSION",
              "docs",
              "README.md",
              "LICENSE",
          ]

          def git(*args, check=True, quiet=False):
              result = subprocess.run(
                  ["git", *args],
                  capture_output=True,
                  text=True,
                  check=check if not quiet else False,
              )
              return result.stdout.strip() if not quiet else result

          def tag_exists(tag):
              result = subprocess.run(
                  ["git", "rev-parse", "-q", "--verify", f"refs/tags/{tag}"],
                  capture_output=True,
              )
              return result.returncode == 0

          def current_version():
              version = open("VERSION", encoding="utf-8").read().strip()
              if not version:
                  raise SystemExit("VERSION file is empty")
              return version

          def changed_since_latest_tag():
              latest = git("describe", "--tags", "--abbrev=0", "--match", "v[0-9]*", quiet=True)
              if latest.returncode != 0:
                  return ["<initial-release>"]
              diff = git("diff", "--name-only", f"{latest.stdout.strip()}..HEAD")
              return [path for path in diff.splitlines() if path]

          def is_relevant(path):
              return any(path == prefix or path.startswith(f"{prefix}/") for prefix in RELEVANT_PATHS)

          def bump_patch(version):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
              if not match:
                  raise SystemExit(f"Cannot auto-bump non-standard version: {version}")
              return f"{match.group(1)}.{match.group(2)}.{int(match.group(3)) + 1}"

          def replace_required(path, old_text, new_text):
              source = open(path, encoding="utf-8").read()
              if old_text not in source:
                  raise SystemExit(f"{path} does not contain the expected release version {old_text}")
              open(path, "w", encoding="utf-8").write(source.replace(old_text, new_text))

          def prepend_changelog_entry(version, previous):
              path = "CHANGELOG.md"
              source = open(path, encoding="utf-8").read()
              header = "# Changelog\n"
              if not source.startswith(header):
                  raise SystemExit(f"{path} does not start with the expected header")
              today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
              entry = (
                  f"\n## {version} - {today}\n\n"
                  f"- Automated patch release of the unreleased changes on `main` since {previous}.\n"
              )
              open(path, "w", encoding="utf-8").write(header + entry + source[len(header):])

          def write_output(values):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  for key, value in values.items():
                      handle.write(f"{key}={value}\n")

          changed = changed_since_latest_tag()
          if changed[0] != "<initial-release>" and not any(is_relevant(path) for path in changed):
              version = current_version()
              write_output({
                  "release_needed": "false",
                  "version": version,
                  "tag": f"v{version}",
                  "release_sha": git("rev-parse", "HEAD"),
              })
              print("No release-relevant library changes since the latest tag.")
              raise SystemExit(0)

          version = current_version()
          if tag_exists(f"v{version}"):
              next_version = bump_patch(version)
              replace_required("VERSION", version, next_version)
              replace_required(
                  "include/thalovant/version.h",
                  f'#define THALOVANT_VERSION "{version}"',
                  f'#define THALOVANT_VERSION "{next_version}"',
              )
              replace_required(
                  "tests/test_version.c",
                  f'#define TLV_EXPECTED_VERSION "{version}"',
                  f'#define TLV_EXPECTED_VERSION "{next_version}"',
              )
              replace_required("README.md", f"v{version}", f"v{next_version}")
              replace_required(
                  "docs/linux-websocket.md",
                  f"ThalovantEmbeddedC/{version}",
                  f"ThalovantEmbeddedC/{next_version}",
              )
              prepend_changelog_entry(next_version, f"v{version}")
              git("config", "user.name", "github-actions[bot]")
              git("config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
              git(
                  "add",
                  "VERSION",
                  "include/thalovant/version.h",
                  "tests/test_version.c",
                  "README.md",
                  "docs/linux-websocket.md",
                  "CHANGELOG.md",
              )
              git("commit", "-m", f"release: bump embedded C library to {next_version}")
              git("push", "origin", "HEAD:main")
              version = next_version

          write_output({
              "release_needed": "true",
              "version": version,
              "tag": f"v{version}",
              "release_sha": git("rev-parse", "HEAD"),
          })
          PY

      - name: Build and test with gcc
        if: steps.plan.outputs.release_needed == 'true'
        run: |
          make clean
          make CC=gcc
          make test CC=gcc

      - name: Build and test with clang
        if: steps.plan.outputs.release_needed == 'true'
        run: |
          make clean
          make CC=clang
          make test CC=clang

      - name: Create GitHub release
        if: steps.plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_SHA: ${{ steps.plan.outputs.release_sha }}
        run: gh release create "$TAG" --target "$RELEASE_SHA" --title "$TAG" --notes "Release $TAG"

      - name: Dispatch release publication
        if: steps.plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh workflow run release.yml --ref main -f release_tag="$TAG"
